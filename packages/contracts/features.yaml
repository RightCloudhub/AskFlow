# AskFlow feature plugins — L2 profiles (PRD + pluggable architecture)
# Env: ASKFLOW_PROFILE=full|enterprise|mvp|core-only|faq-only
#      ASKFLOW_FEATURES=+sla,-mcp  (comma-separated deltas)

profiles:
  core-only:
    - core
  faq-only:
    - core
    - rag
  mvp:
    - core
    - rag
    - agent
    - tools
    - ticket
    - handoff
    - knowledge
    - ops
    - cost
    - widget
  enterprise:
    - core
    - rag
    - agent
    - tools
    - ticket
    - handoff
    - knowledge
    - ops
    - cost
    - sla
    - notify
    - sso
    - teams
    - connectors
    - launch
    - analytics
    - mcp
    - widget
    - feishu
    - qc
  full:
    - core
    - rag
    - agent
    - tools
    - ticket
    - handoff
    - knowledge
    - ops
    - cost
    - sla
    - notify
    - sso
    - teams
    - connectors
    - launch
    - analytics
    - mcp
    - widget
    - feishu
    - wecom
    - dingtalk
    - qc

  mall:
    - core
    - rag
    - agent
    - tools
    - ticket
    - handoff
    - knowledge
    - ops
    - cost
    - widget
    - mall_core
    - mall_account
    - mall_catalog
    - mall_inventory
    - mall_order
    - mall_payment
    - mall_wallet
    - mall_referral
    - mall_notify
    - mall_support
    - mall_admin
  mall-lite:
    - core
    - rag
    - agent
    - tools
    - ticket
    - handoff
    - notify
    - widget
    - mall_core
    - mall_account
    - mall_catalog
    - mall_inventory
    - mall_order
    - mall_payment
    - mall_wallet
    - mall_referral
    - mall_notify
    - mall_support
    - mall_admin
  mall-only:
    - core
    - ticket
    - handoff
    - notify
    - mall_core
    - mall_account
    - mall_catalog
    - mall_inventory
    - mall_order
    - mall_payment
    - mall_wallet
    - mall_referral
    - mall_notify
    - mall_support
    - mall_admin

plugins:
  core:
    depends: []
  rag:
    depends: [core]
  agent:
    depends: [core]
  tools:
    depends: [agent]
  ticket:
    depends: [core]
  handoff:
    depends: [core]
  knowledge:
    depends: [rag]
  ops:
    depends: [core]
  cost:
    depends: [core]
  sla:
    depends: [ticket]
  notify:
    depends: [core]
  sso:
    depends: [core]
  teams:
    depends: [handoff]
  connectors:
    depends: [core]
  launch:
    depends: [core]
  analytics:
    depends: [core]
  mcp:
    depends: [tools]
  widget:
    depends: [core]
  feishu:
    depends: [core]
  wecom:
    depends: [core]
  dingtalk:
    depends: [core]
  qc:
    depends: [analytics]
  mall_core:
    depends: [core]
  mall_account:
    depends: [mall_core]
  mall_catalog:
    depends: [mall_core]
  mall_inventory:
    depends: [mall_catalog]
  mall_order:
    depends: [mall_inventory, mall_account]
  mall_payment:
    depends: [mall_order]
  mall_wallet:
    depends: [mall_account]
  mall_referral:
    depends: [mall_wallet]
  mall_notify:
    depends: [mall_core, notify]
  mall_support:
    depends: [mall_order, ticket, handoff]
  mall_admin:
    depends: [mall_core]
