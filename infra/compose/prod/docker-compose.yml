x-api: &api
  image: askflow-mall:full
  build:
    context: ../../..
    dockerfile: infra/compose/Dockerfile.mall
    args: {API_EXTRAS: mall-full}
  env_file: .env
  environment: &environment
    ASKFLOW_ENV: production
    ASKFLOW_PROFILE: mall
    ASKFLOW_INFRA: full
    DATABASE_URL: postgresql+asyncpg://askflow:${POSTGRES_PASSWORD:?required}@postgres:5432/askflow
    DATABASE_READ_URLS: postgresql+asyncpg://askflow:${POSTGRES_PASSWORD:?required}@replica:5432/askflow
    REDIS_URL: redis://redis:6379/0
    SEARCH_URL: http://elasticsearch:9200
    S3_ENDPOINT: http://minio:9000
    S3_ACCESS_KEY: ${MINIO_ROOT_USER:?required}
    S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?required}
    S3_BUCKET: askflow
    INSTANCE_COUNT: "2"
    WEB_CONCURRENCY: "1"
    RATE_LIMIT_PER_MINUTE: "600"
    WORKER_MODE: separate
    REVISION_STORE_DIR: /data/revisions
    MALL_DEMO_MAILBOX_ENABLED: "false"
  depends_on:
    migrate: {condition: service_completed_successfully}
    bucket: {condition: service_completed_successfully}
    replica: {condition: service_healthy}
    redis: {condition: service_healthy}
    elasticsearch: {condition: service_healthy}
  volumes: ["revisions:/data/revisions"]
  restart: unless-stopped
services:
  postgres:
    image: postgres:16-alpine
    command: [postgres, -c, wal_level=replica, -c, max_wal_senders=5, -c, hot_standby=on]
    environment:
      POSTGRES_USER: askflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
      POSTGRES_DB: askflow
      REPLICATION_PASSWORD: ${REPLICATION_PASSWORD:?required}
    volumes:
      - postgres:/var/lib/postgresql/data
      - ./replication.sh:/docker-entrypoint-initdb.d/replication.sh:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U askflow"]
      interval: 5s
      retries: 20
  replica:
    image: postgres:16-alpine
    entrypoint: [sh, /replica.sh]
    environment:
      PGPASSWORD: ${REPLICATION_PASSWORD:?required}
    volumes:
      - replica:/var/lib/postgresql/data
      - ./replica.sh:/replica.sh:ro
    depends_on:
      postgres: {condition: service_healthy}
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U askflow"]
      interval: 5s
      retries: 30
  redis:
    image: redis:7-alpine
    command: [redis-server, --appendonly, "yes"]
    volumes: ["redis:/data"]
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: ["objects:/data"]
    ports: ["127.0.0.1:9000:9000"]
  bucket:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    entrypoint: [sh, /bucket.sh]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: ["./bucket.sh:/bucket.sh:ro"]
    depends_on: [minio]
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.15.5
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: ["search:/usr/share/elasticsearch/data"]
    healthcheck:
      test: [CMD-SHELL, "curl --fail --silent 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s'"]
      interval: 10s
      timeout: 10s
      retries: 30
  migrate:
    image: askflow-mall:full
    build:
      context: ../../..
      dockerfile: infra/compose/Dockerfile.mall
      args: {API_EXTRAS: mall-full}
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://askflow:${POSTGRES_PASSWORD:?required}@postgres:5432/askflow
    command: [alembic, upgrade, head]
    depends_on:
      postgres: {condition: service_healthy}
  api:
    <<: *api
    deploy: {replicas: 2}
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
  worker:
    <<: *api
    command: [python, -m, app.commerce.worker]
  nginx:
    image: nginx:1.27-alpine
    ports: ["127.0.0.1:8080:80"]
    volumes: ["./nginx.conf:/etc/nginx/nginx.conf:ro"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres:
  replica:
  redis:
  objects:
  search:
  revisions:
