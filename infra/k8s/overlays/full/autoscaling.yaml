apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: askflow-mall
spec:
  scaleTargetRef: {apiVersion: apps/v1, kind: Deployment, name: askflow-mall}
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: askflow-mall
spec:
  minAvailable: 1
  selector:
    matchLabels: {app: askflow-mall}
