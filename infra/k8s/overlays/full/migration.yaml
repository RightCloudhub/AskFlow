apiVersion: batch/v1
kind: Job
metadata:
  name: askflow-mall-migrate-v1
spec:
  backoffLimit: 1
  activeDeadlineSeconds: 600
  template:
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001}
      containers:
        - name: migrate
          image: askflow-mall:full
          command: [alembic, upgrade, head]
          envFrom:
            - secretRef: {name: mall-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
