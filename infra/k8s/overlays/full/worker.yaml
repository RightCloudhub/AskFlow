apiVersion: apps/v1
kind: Deployment
metadata:
  name: askflow-mall-worker
spec:
  replicas: 2
  selector:
    matchLabels: {app: askflow-mall-worker}
  template:
    metadata:
      labels: {app: askflow-mall-worker}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 60
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001}
      containers:
        - name: worker
          image: askflow-mall:full
          command: [python, -m, app.commerce.worker]
          volumeMounts: [{name: revisions, mountPath: /data/revisions}]
          envFrom:
            - configMapRef: {name: mall-config}
            - secretRef: {name: mall-secrets}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
      volumes:
        - name: revisions
          persistentVolumeClaim: {claimName: mall-revisions}
