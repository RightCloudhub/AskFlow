apiVersion: apps/v1
kind: Deployment
metadata:
  name: askflow-mall
spec:
  replicas: 1
  selector:
    matchLabels: {app: askflow-mall}
  template:
    metadata:
      labels: {app: askflow-mall}
    spec:
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 45
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: api
          image: askflow-mall:lite
          ports: [{name: http, containerPort: 8000}]
          envFrom:
            - configMapRef: {name: mall-config}
            - secretRef: {name: mall-secrets}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "4", memory: 8Gi}
          startupProbe:
            httpGet: {path: /health/ready, port: http}
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet: {path: /health/ready, port: http}
            periodSeconds: 5
          livenessProbe:
            httpGet: {path: /health/live, port: http}
            periodSeconds: 10
