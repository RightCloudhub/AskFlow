openapi: 3.1.0
info:
  title: AskFlow Mall implementation contract subset
  version: 0.1.0-draft
  description: Source-aligned subset, not a generated or validated schema. See api.md for all routes.
servers:
  - url: /api/v1
security:
  - bearer: []
paths:
  /mall/features:
    get:
      operationId: mallFeatures
      security: []
      responses:
        '200': {description: Public enabled mall feature identifiers}
  /mall/account/register:
    post:
      operationId: mallRegister
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Register'}
      responses:
        '202': {description: Uniform accepted response}
        default: {$ref: '#/components/responses/Error'}
  /mall/account/login:
    post:
      operationId: mallLogin
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Login'}
      responses:
        '200': {description: Short access JWT and rotated HttpOnly refresh cookie}
        default: {$ref: '#/components/responses/Error'}
  /mall/account/refresh:
    post:
      operationId: mallRefresh
      security: [{refreshCookie: []}]
      responses:
        '200': {description: New access and refresh tokens}
        '401': {$ref: '#/components/responses/Error'}
  /mall/catalog/search:
    get:
      operationId: mallProducts
      security: []
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Cursor page of active products with integer prices}
  /mall/order/checkout:
    post:
      operationId: mallQuote
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Checkout'}
      responses:
        '200': {description: Server quote and single-use checkout token}
        default: {$ref: '#/components/responses/Error'}
  /mall/order/orders:
    get:
      operationId: mallOrders
      parameters:
        - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200': {description: Owner-scoped cursor page}
    post:
      operationId: mallCreateOrder
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/PlaceOrder'}
      responses:
        '200': {description: Order and stock reservations committed atomically}
        default: {$ref: '#/components/responses/Error'}
  /mall/order/orders/{order_id}:
    parameters:
      - name: order_id
        in: path
        required: true
        schema: {type: string, format: uuid}
    get:
      operationId: mallOrderDetail
      responses:
        '200': {description: Owner-scoped order snapshot}
        '404': {$ref: '#/components/responses/Error'}
  /mall/payment:
    post:
      operationId: mallCreatePayment
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Payment'}
      responses:
        '200': {description: Server-computed payment and mock gateway instructions}
        default: {$ref: '#/components/responses/Error'}
  /mall/payment/callbacks/mock:
    post:
      operationId: mallMockCallback
      security: []
      responses:
        '200': {description: HMAC-verified callback processed idempotently}
        default: {$ref: '#/components/responses/Error'}
  /mall/wallet:
    get:
      operationId: mallWalletBalance
      responses:
        '200': {description: Owner available/frozen balance and currency}
  /mall/order/orders/{order_id}/cancel:
    parameters:
      - {name: order_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: mallCancelOrder
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Cancel'}
      responses:
        '200': {description: Policy and argument-bound confirmation token}
        default: {$ref: '#/components/responses/Error'}
  /mall/order/orders/{order_id}/refunds:
    parameters:
      - {name: order_id, in: path, required: true, schema: {type: string, format: uuid}}
    post:
      operationId: mallRefundOrder
      parameters:
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/Refund'}
      responses:
        '200': {description: Governed result or durable human approval request}
        default: {$ref: '#/components/responses/Error'}
  /admin/infra:
    get:
      operationId: mallInfra
      responses:
        '200': {description: Implementations, safety and degradation; no connection secrets}
        '403': {$ref: '#/components/responses/Error'}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer, bearerFormat: JWT}
    refreshCookie: {type: apiKey, in: cookie, name: mall_refresh}
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 1, maxLength: 128}
    Cursor:
      name: cursor
      in: query
      schema: {type: string}
  responses:
    Error:
      description: Uniform business/security error; no resource existence leak
      content:
        application/json:
          schema: {$ref: '#/components/schemas/Error'}
  schemas:
    Error:
      type: object
      required: [code, message, trace_id]
      properties:
        code: {type: string}
        message: {type: string}
        trace_id: {type: string}
    Money:
      type: object
      required: [amount_cents, currency]
      properties:
        amount_cents: {type: integer, minimum: 0, maximum: 9007199254740991}
        currency: {type: string, pattern: '^[A-Z]{3}$'}
    Register:
      type: object
      additionalProperties: false
      required: [username, password, verification_id, verification_token]
      properties:
        username: {type: string, minLength: 3, maxLength: 64}
        password: {type: string, minLength: 12, maxLength: 128}
        verification_id: {type: string, format: uuid}
        verification_token: {type: string}
        referral_code: {type: string}
    Login:
      type: object
      additionalProperties: false
      required: [identifier]
      properties:
        identifier: {type: string}
        password: {type: string}
        verification_id: {type: string}
        verification_token: {type: string}
        totp: {type: string}
        recovery_code: {type: string}
    Item:
      type: object
      additionalProperties: false
      required: [sku_id, qty]
      properties:
        sku_id: {type: string, format: uuid}
        qty: {type: integer, minimum: 1}
    Checkout:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Item'}}
        address_id: {type: [string, 'null'], format: uuid}
    PlaceOrder:
      type: object
      additionalProperties: false
      required: [items, checkout_token]
      properties:
        items: {type: array, minItems: 1, items: {$ref: '#/components/schemas/Item'}}
        address_id: {type: [string, 'null'], format: uuid}
        checkout_token: {type: string}
    Payment:
      type: object
      additionalProperties: false
      required: [order_id, method]
      properties:
        order_id: {type: string, format: uuid}
        method: {type: string, enum: [wallet, mock, mixed]}
        wallet_cents: {type: integer, minimum: 0}
        step_up_token: {type: string}
    Cancel:
      type: object
      additionalProperties: false
      required: [expected_version]
      properties:
        expected_version: {type: integer, minimum: 0}
        reason: {type: string}
        confirmation_token: {type: string}
    Refund:
      type: object
      additionalProperties: false
      required: [amount_cents, reason]
      properties:
        amount_cents: {type: integer, minimum: 1}
        reason: {type: string}
        destination: {type: string, enum: [original, wallet]}
        confirmation_token: {type: string}
