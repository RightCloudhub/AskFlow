# AskFlow CI — API pytest + offline eval (PRD §12.2 #7 / Wave D)
name: ci

on:
  workflow_dispatch:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  ASKFLOW_ENV: test
  SECRET_KEY: test-secret-key-not-for-prod
  DATABASE_URL: "sqlite+aiosqlite:///:memory:"
  ASKFLOW_PROFILE: full
  # Keep tests and evaluation independent of remote model services.
  LLM_BASE_URL: ""
  LLM_API_KEY: ""
  EMBEDDING_BASE_URL: ""
  EMBEDDING_API_KEY: ""

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-test:
    name: api-pytest
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/pyproject.toml
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run pytest
        run: python -m pytest -q --junitxml=test-results/pytest.xml
      - name: Upload pytest results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: api-pytest-results
          path: apps/api/test-results/pytest.xml
          if-no-files-found: warn
          retention-days: 14

  eval:
    name: offline-eval
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            apps/api/requirements.txt
            apps/api/pyproject.toml
      - name: Install API deps for eval runner
        working-directory: apps/api
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e ".[dev]"
      - name: Run offline eval
        env:
          PYTHONPATH: apps/api
        run: python evals/runners/run_eval.py

  web-build:
    name: web-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run build
